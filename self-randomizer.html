<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-randomizer</title>
    
    <link rel="stylesheet" href="css/self-randomizer.css">
</head>
<body>

    <a href="index.html" id="cornerButton">BACK</a>

    <div class="slider-section">
        <h2>ช่องอาวุธ: <span id="slotDisplay">5</span></h2>
        <div class="slider">
            <input type="range" id="slotSlider" min="1" max="6" value="5" step="1">
        </div>
    </div>

    <div class="main-container">

        <div class="text-container">
            <h2><span id="weaponNameDisplay1">WEAPON1</span></h2>
            <h2><span id="weaponNameDisplay2">WEAPON2</span></h2>
        </div>    

        <div class="image-weapon-container">
            <div class="image-slot", id="weapon1Img">
                <img src="images/weapons/empty.png" alt="empty" + title="empty">
            </div>
            <div class="image-slot", id="weapon2Img">
                <img src="images/weapons/empty.png" alt="empty" + title="empty">
            </div>
        </div>

        <div class="text-container">
            <h1><span id="duelText1"></span></h1>
            <h1><span id="duelText2"></span></h1>
        </div>    

    </div>

    <div class="button-container">
        <button id="randomizeButton">สุ่ม</button>
    </div>

    <script src="js/self-randomizer.js"></script>

</body>
</html>
