<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunt Showdown - Roguelike Campaign</title>
    
    <link rel="stylesheet" href="css/self-randomizer.css">
    <link rel="stylesheet" href="css/roguelike.css">
</head>
<body>

    <a href="index.html" id="cornerButton">กลับหน้าหลัก</a>

    <div class="campaign-header">
        <h1>Hunt: Roguelike Campaign</h1>
        <div class="strikes-container" id="strikesDisplay">
            Strikes: <span id="strikeCount">0</span> / 3
        </div>
        <button id="resetCampaignBtn" class="danger-btn">Abandon Run</button>
    </div>

    <!-- Timeline of 15 Nodes -->
    <div class="timeline-container" id="timelineContainer">
        <!-- Generated by JS -->
    </div>

    <div class="main-layout">
        <!-- Left: Action Panel -->
        <div class="action-panel">
            <h2 id="nodeTitle">Node 1: Loot</h2>
            <div id="nodeContent" class="node-content">
                <p>Loading...</p>
            </div>
            <div id="nodeActions" class="node-actions">
                <!-- Action buttons (e.g. Open Loot, Advance) injected by JS -->
            </div>
        </div>

        <!-- Right: Team Stash -->
        <div class="mini-stash-panel">
            <h2>Team Stash</h2>
            <p style="font-size: 14px; margin-bottom: 15px;">Click to remove equipped items.</p>
            
            <div class="stash-category">
                <h3>Weapons (<span id="weaponCount">0</span>)</h3>
                <div class="mini-stash-grid" id="stashWeapons"></div>
            </div>

            <div class="stash-category">
                <h3>Tools (<span id="toolCount">0</span>)</h3>
                <div class="mini-stash-grid" id="stashTools"></div>
            </div>

            <div class="stash-category">
                <h3>Consumables (<span id="consumableCount">0</span>)</h3>
                <div class="mini-stash-grid" id="stashConsumables"></div>
            </div>
        </div>
    </div>

    <script src="js/roguelike.js"></script>

</body>
</html>
